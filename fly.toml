app = "ridewithkeijsi"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/prod.db"
  NEXT_PUBLIC_SITE_URL = "https://ridewithkeijsi.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
